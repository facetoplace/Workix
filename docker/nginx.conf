server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index workix.html;

  # SPA + pretty paths: hub app is workix.html
  location = / {
    try_files /workix.html =404;
  }

  location /hub/ {
    alias /usr/share/nginx/html/hub/;
    try_files $uri =404;
  }

  location / {
    try_files $uri $uri/ /workix.html;
  }

  location ~* \.(js|css|png|jpg|svg|ico|webp|woff2?)$ {
    expires 7d;
    add_header Cache-Control "public";
    try_files $uri =404;
  }
}
