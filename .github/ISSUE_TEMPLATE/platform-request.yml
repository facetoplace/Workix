name: Add or remove a platform
description: Suggest a platform for the Workix MCP catalog.
title: "[Platform] "
labels:
  - platform
body:
  - type: dropdown
    id: action
    attributes:
      label: What should happen?
      options:
        - Add this platform
        - Remove this platform
    validations:
      required: true
  - type: input
    id: platform
    attributes:
      label: Platform name
      placeholder: e.g. Example Jobs
    validations:
      required: true
  - type: input
    id: url
    attributes:
      label: Platform URL
      placeholder: https://example.com
    validations:
      required: true
  - type: textarea
    id: reason
    attributes:
      label: Why should it be added or removed?
      description: Include useful details about the platform, API/feed, region, or access requirements.
    validations:
      required: true
  - type: checkboxes
    id: terms
    attributes:
      label: Checklist
      options:
        - label: I checked that this platform is not already listed.
          required: true
